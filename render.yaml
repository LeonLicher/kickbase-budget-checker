services:
  - type: web
    name: kickbase-budget-checker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    # Render's own health check keeps hitting this, and it never does work.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Set these in the Render dashboard, they are never committed.
      - key: KICKBASE_EMAIL
        sync: false
      - key: KICKBASE_PASSWORD
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: TRIGGER_SECRET
        generateValue: true
      # When the check runs. Times are local to CHECK_TIMEZONE, so the
      # CEST/CET switch is handled automatically.
      - key: CHECK_DAYS
        value: Fri
      - key: CHECK_WINDOW_START
        value: "17:00"
      - key: CHECK_WINDOW_END
        value: "19:30"
      - key: CHECK_INTERVAL_MINUTES
        value: "30"
